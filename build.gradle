plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.openapi.generator' version '7.8.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.kafka:spring-kafka'

	// Springdoc OpenAPI for interactive Swagger UI at /swagger-ui.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// Jackson nullable support for OpenAPI models
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'

	// Testing: Spring Boot Test bundles JUnit 5 Jupiter, Mockito, AssertJ
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiGenerate {
	generatorName = "spring"
	inputSpec = "$rootDir/src/main/resources/specs/openapi.yaml".toString()
	outputDir = "$buildDir/generated/openapi".toString()
	apiPackage = "com.example.demo.api"
	modelPackage = "com.example.demo.model"
	invokerPackage = "com.example.demo.invoker"

	configOptions = [
			interfaceOnly       : "true",
			useSpringBoot3      : "true",      // Uses jakarta.* packages (Spring Boot 3 / Java 21)
			useBeanValidation   : "true",      // Emits @NotNull, @Size, @Valid annotations
			dateLibrary         : "java8",     // java.time.* (LocalDate, OffsetDateTime)
			skipDefaultInterface: "true",      // Produces pure interfaces without default bodies
			useTags             : "true",      // Groups APIs by tags
			openApiNullable     : "true"
	]
}

sourceSets {
	main {
		java {
			srcDir "$buildDir/generated/openapi/src/main/java"
		}
	}
}

compileJava.dependsOn tasks.openApiGenerate

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}
