server:
  port: 8080

spring:
  application:
    name: url-shortner
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/linkdb}
      auto-index-creation: true

memory: mongo
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha
    url: /specs/openapi.yaml